build-system = { requires = ["hatch-angee>=1,<2"], build-backend = "hatch_angee" }

[project]
name = "angee-posts-integrate-youtube"
version = "1.0.0"
description = "Connect a YouTube channel, poll its comments, and publish public replies"
keywords = ["youtube", "feeds", "comments"]
dependencies = ["angee-posts>=3,<4", "angee-integrate>=3,<4", "angee-parties>=3,<4"]

[project.entry-points]
"angee.addons" = {"angee.posts_integrate_youtube" = "angee.posts_integrate_youtube"}

[tool.angee]
category = "Integration"

[[tool.angee.resources.install]]
path = "install/010_integrate.oauthclient.yaml"
adopt = ["slug", "environment"]
