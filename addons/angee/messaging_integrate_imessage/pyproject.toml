build-system = { requires = ["hatch-angee>=1,<2"], build-backend = "hatch_angee" }

[project]
name = "angee-messaging-integrate-imessage"
version = "1.0.0"
description = "SMS + iMessage import — reads Apple's Messages store from an unencrypted iPhone backup into messaging threads and messages"
keywords = ["imessage", "sms", "chat", "iphone", "backup"]
dependencies = ["angee-messaging>=3,<4", "angee-integrate>=3,<4", "angee-integrate-iphone>=3,<4", "angee-parties>=3,<4", "angee-storage>=3,<4", "angee-storage-integrate-iphone>=3,<4", "angee-workflows-integrate>=3,<4"]

[project.entry-points]
"angee.addons" = {"angee.messaging_integrate_imessage" = "angee.messaging_integrate_imessage"}

[tool.angee]
category = "Integration"

[[tool.angee.resources.master]]
path = "master/010_integrate.vendor.yaml"
adopt = "slug"
