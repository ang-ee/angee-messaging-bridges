# Angee addon manifest. The declarative contract hatch-angee compiles into
# the package's [project] + entry points; see hatch-angee's native AddonManifest.
[addon]
name = "angee.messaging_integrate_matrix"
description = "Matrix sync — signs in a user's account and pulls rooms into messaging"
keywords = ["matrix", "chat", "sync", "e2ee"]
category = "Integration"
depends_on = ["angee.messaging", "angee.integrate", "angee.parties"]
dependencies = [
  "matrix-nio[e2e]>=0.26",
  "pycryptodome>=3.18",
  "unpaddedbase64>=2.1",
]

[resources]
master = [{ path = "resources/master/010_integrate.vendor.yaml", adopt = "slug" }]
