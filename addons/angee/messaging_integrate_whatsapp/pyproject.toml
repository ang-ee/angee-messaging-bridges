build-system = { requires = ["hatch-angee>=1,<2"], build-backend = "hatch_angee" }

[project]
name = "angee-messaging-integrate-whatsapp"
version = "1.0.0"
description = "WhatsApp sync — pairs a linked device by QR code and pulls chats into messaging threads and messages"
keywords = ["whatsapp", "chat", "sync"]
dependencies = ["angee-messaging>=3,<4", "angee-integrate>=3,<4", "angee-integrate-iphone>=3,<4", "angee-parties>=3,<4", "angee-storage>=3,<4", "angee-storage-integrate-iphone>=3,<4", "angee-workflows-integrate>=3,<4", "angee-web>=3,<4", "neonize>=0.4.3.post0"]

[project.entry-points]
"angee.addons" = {"angee.messaging_integrate_whatsapp" = "angee.messaging_integrate_whatsapp"}

[tool.angee]

[[tool.angee.resources.master]]
path = "master/010_integrate.vendor.yaml"
adopt = "slug"

[tool.angee.platform]
category = "Integration"
