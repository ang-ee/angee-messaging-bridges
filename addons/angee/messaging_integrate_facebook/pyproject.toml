build-system = { requires = ["hatch-angee>=1,<2"], build-backend = "hatch_angee" }

[project]
name = "angee-messaging-integrate-facebook"
version = "1.0.0"
description = "Facebook takeout import — messages, own posts, comments, albums, and friend connections"
keywords = ["facebook", "meta", "takeout", "messages", "posts", "connections"]
dependencies = ["angee-messaging>=3,<4", "angee-integrate>=3,<4", "angee-parties>=3,<4", "angee-posts>=3,<4", "angee-workflows-integrate>=3,<4", "angee-messaging-integrate-meta>=1,<2", "angee-provenance>=3,<4"]

[project.entry-points]
"angee.addons" = {"angee.messaging_integrate_facebook" = "angee.messaging_integrate_facebook"}

[tool.angee]
category = "Integration"
