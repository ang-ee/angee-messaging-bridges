build-system = { requires = ["hatch-angee>=1,<2"], build-backend = "hatch_angee" }

[project]
name = "angee-messaging-integrate-discord"
version = "1.0.0"
description = "Discord messaging sync — runs a sanctioned bot on the Gateway"
keywords = ["discord", "bot", "gateway", "chat", "messaging"]
dependencies = ["angee-messaging>=3,<4", "angee-integrate>=3,<4", "angee-parties>=3,<4", "angee-web>=3,<4", "discord-py>=2.7"]

[project.entry-points]
"angee.addons" = {"angee.messaging_integrate_discord" = "angee.messaging_integrate_discord"}

[tool.angee]

[[tool.angee.resources.master]]
path = "master/010_integrate.vendor.yaml"
adopt = "slug"

[tool.angee.platform]
category = "Integration"
