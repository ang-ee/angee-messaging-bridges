name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    # Keep this ref aligned with framework-ref so checks share the runtime contract.
    uses: ang-ee/angee-django/.github/workflows/reusable-checks.yml@5de640523219248671158e0665b5d8656bf1eb1b
    secrets: inherit
    with:
      python-version: "3.14"
      # Match the framework manifests used to generate this dependency lock.
      framework-ref: "5de640523219248671158e0665b5d8656bf1eb1b"
      # The suite resolves base addons from the sibling slot and the
      # fragments' @angee/gql fixture is the stack root's composed runtime/,
      # so pytest + typecheck/test run in the stack lane.
      uv-enabled: false
      pnpm-enabled: false
      stack-enabled: true
