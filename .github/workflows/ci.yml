name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels the run it supersedes; every main commit runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    # Keep this ref aligned with framework-ref so checks share the runtime contract.
    uses: ang-ee/angee-django/.github/workflows/reusable-checks.yml@5b2ddf3e8da61a0e2b2d847cb2fd075fb3eca96a
    secrets: inherit
    with:
      # The framework's .python-version holds the CPython pin the composed stack runs on.
      # Match the framework manifests used to generate this dependency lock.
      framework-ref: "5b2ddf3e8da61a0e2b2d847cb2fd075fb3eca96a"
      # The framework's stack lane runs bridge pytest with this checkout's
      # configuration and checks fragments against the composed host's @angee/gql.
      uv-enabled: false
      pnpm-enabled: false
      stack-enabled: true
      # CI_RUNS_ON (a JSON runs-on value) moves every job to self-hosted runners; a
      # pull request from a fork always runs on GitHub-hosted ones.
      runs-on: ${{ (github.event.pull_request.head.repo.fork && '"ubuntu-latest"') || vars.CI_RUNS_ON || '"ubuntu-latest"' }}
