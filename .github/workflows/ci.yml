name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]

# A new push to a pull request cancels the run it supersedes; every main commit runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    # Keep this ref aligned with framework-ref so checks share the runtime contract.
    uses: ang-ee/angee-django/.github/workflows/reusable-checks.yml@efcf54ef897a3c78bb643004ec1d724cef820857
    secrets: inherit
    with:
      # The framework's .python-version holds the CPython pin the composed stack runs on.
      # Match the framework manifests used to generate this dependency lock.
      framework-ref: "efcf54ef897a3c78bb643004ec1d724cef820857"
      # The suite resolves base addons from the sibling slot and the
      # fragments' @angee/gql fixture is the stack root's composed runtime/,
      # so pytest + typecheck/test run in the stack lane.
      uv-enabled: false
      pnpm-enabled: false
      stack-enabled: true
      # CI_RUNS_ON (a JSON runs-on value) moves every job to self-hosted runners.
      runs-on: ${{ vars.CI_RUNS_ON || '"ubuntu-latest"' }}
