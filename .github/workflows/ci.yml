name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]

# A new push to a pull request cancels the run it supersedes; every main commit runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    # Keep this ref aligned with framework-ref so checks share the runtime contract.
    uses: ang-ee/angee-django/.github/workflows/reusable-checks.yml@508311d12c3e753336257acee7c8a2fd8b2cd5ff
    secrets: inherit
    with:
      python-version: "3.14"
      # Match the framework manifests used to generate this dependency lock.
      framework-ref: "508311d12c3e753336257acee7c8a2fd8b2cd5ff"
      # The suite resolves base addons from the sibling slot and the
      # fragments' @angee/gql fixture is the stack root's composed runtime/,
      # so pytest + typecheck/test run in the stack lane.
      uv-enabled: false
      pnpm-enabled: false
      stack-enabled: true
