[project]
name = "angee-messaging-bridges"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = ["django-angee[postgres]"]

[dependency-groups]
dev = [
  "daphne>=4.0",
  "faker>=30.0",
  "pytest>=8.0",
  "pytest-django>=4.8",
  "ruff>=0.15.12",
]

# Compiled from addons/ and ../angee/addons because the bridge test environment composes both roots.



# GENERATED by angee build from the enabled addons' manifests — do not edit
addons = [
    "agent-client-protocol==1.0.0rc2",
    "anthropic>=0.109.2",
    "authlib>=1.8.0",
    "billiard>=4.2.1,<4.3",
    "celery[redis]>=5.5",
    "channels-redis>=4.2",
    "channels>=4.0",
    "cryptg>=0.6.0",
    "cryptography>=44",
    "deepdiff>=9.1.0",
    "discord-py>=2.7",
    "django-anymail>=15.1",
    "django-axes>=8.0",
    "django-celery-beat @ git+https://github.com/celery/django-celery-beat.git@b5e3443d647baf910c0168f25b512dd388ba669e",
    "django-choices-field @ git+https://github.com/ang-ee/django-choices-field.git@b02c1488660d0bf1f4483d2e73bc842b41b70632",
    "django-countries>=9,<10",
    "django-import-export>=4.4",
    "django-simple-history>=3.13",
    "django-sqids>=0.1",
    "django-zed-rebac>=0.30.0",
    "django-zed-rebac[strawberry-django]>=0.30.0",
    "fastmcp>=3.4.2,<4",
    "graphql-core>=3.3.1,<3.4",
    "httpcore2>=2.10,<3",
    "httpx2>=2.10,<3",
    "httpx>=0.28.1,<0.29",
    "imapclient>=3.1.0",
    "jsonpointer>=3.1",
    "jsonschema[format-nongpl]>=4.26",
    "mail-parser-reply>=1.36",
    "markdown-it-py>=4.2",
    "matrix-nio[e2e]>=0.26",
    "mcp>=1.2",
    "neonize>=0.4.3.post0",
    "openai>=2.43.0",
    "phonenumbers>=9.0",
    "pillow>=11.0",
    "pycountry>=26,<27",
    "pycryptodome>=3.18",
    "pydantic-ai-slim>=2.13",
    "pydantic-ai-slim[anthropic]>=2.13",
    "pydantic-ai-slim[mcp]>=2.13",
    "pydantic-ai-slim[openai]>=2.13",
    "pydantic>=2.13",
    "pyjwt[crypto]>=2.12",
    "pypdfium2>=4.30",
    "python-dateutil>=2.9",
    "python-magic>=0.4.27",
    "pyyaml>=6",
    "qrcode[pil]>=8.2",
    "referencing>=0.37",
    "requests>=2.32",
    "ruamel.yaml>=0.18",
    "sentry-sdk>=2.71.0",
    "slack-sdk>=3.43.0",
    "sqids>=0.4.1",
    "strawberry-django-aggregates @ git+https://github.com/ang-ee/strawberry-django-aggregates.git@0f374854d19b2709b6d77ae872090ab2a751f1dc",
    "strawberry-django-hasura @ git+https://github.com/ang-ee/strawberry-django-hasura.git@4e1c2da2bcbbc90cc586fef3db8d70f5cd6ccfc0",
    "strawberry-graphql @ git+https://github.com/ang-ee/strawberry.git@273bf0456d914d4df535222c4cbae73dff46a376",
    "strawberry-graphql-django @ git+https://github.com/ang-ee/strawberry-django.git@091238ecd4ae07798ef12e9eb24281540da41ced",
    "tablib>=3",
    "telethon>=1.44",
    "unpaddedbase64>=2.1",
    "urllib3>=2.2",
    "vobject>=0.9.9",
]

[tool.uv]
package = false
default-groups = ["dev", "addons"]
# No cache-dir: a CWD-relative cache mints strays wherever uv runs; the
# default per-user cache is shared and correct.

[tool.uv.sources]
django-angee = { path = "../angee", editable = true }

[tool.pytest.ini_options]
cache_dir = ".pytest_cache"
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
pythonpath = [".", "addons", "../angee/addons"]
addopts = "-ra --strict-markers --import-mode=importlib"

[tool.ruff]
line-length = 120
target-version = "py314"
cache-dir = ".ruff_cache"
src = [".", "addons", "../angee/addons"]
exclude = [
  ".angee",
  ".git",
  ".mypy_cache",
  ".reference",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
  "node_modules",
  "**/runtime",
  # Digest-pinned after materialization (see angee/compose/migrations.py);
  # mechanical reformatting breaks composed hosts.
  "**/runtime_migrations",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
