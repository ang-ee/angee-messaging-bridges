[tool.uv.workspace]
members = ["addons/angee/messaging_integrate_discord", "addons/angee/messaging_integrate_facebook", "addons/angee/messaging_integrate_imessage", "addons/angee/messaging_integrate_matrix", "addons/angee/messaging_integrate_meta", "addons/angee/messaging_integrate_signal", "addons/angee/messaging_integrate_telegram", "addons/angee/messaging_integrate_whatsapp", "addons/angee/posts_integrate_facebook", "addons/angee/posts_integrate_youtube"]
[tool.pytest.ini_options]
cache_dir = ".pytest_cache"
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
pythonpath = [".", "addons", "../angee/addons"]
addopts = "-ra --strict-markers --import-mode=importlib"

[tool.ruff]
line-length = 120
target-version = "py314"
cache-dir = ".ruff_cache"
src = [".", "addons", "../angee/addons"]
exclude = [
  ".angee",
  ".git",
  ".mypy_cache",
  ".reference",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
  "node_modules",
  "**/runtime",
  # Digest-pinned after materialization (see angee/compose/migrations.py);
  # mechanical reformatting breaks composed hosts.
  "**/runtime_migrations",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.sdist]
only-include = ["pyproject.toml", "LICENSE", "LICENSE.GPL"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
