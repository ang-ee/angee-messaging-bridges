[project]
name = "angee-messaging-bridges"
version = "1.0.0"
description = "angee-messaging-bridges addon collection"
requires-python = ">=3.14"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE", "LICENSE.GPL"]
dependencies = [
    "angee-messaging-integrate-discord==1.0.0",
    "angee-messaging-integrate-facebook==1.0.0",
    "angee-messaging-integrate-imessage==1.0.0",
    "angee-messaging-integrate-matrix==1.0.0",
    "angee-messaging-integrate-meta==1.0.0",
    "angee-messaging-integrate-signal==1.0.0",
    "angee-messaging-integrate-telegram==1.0.0",
    "angee-messaging-integrate-whatsapp==1.0.0",
    "angee-posts-integrate-facebook==1.0.0",
    "angee-posts-integrate-youtube==1.0.0",
]

[dependency-groups]
dev = [
    "daphne>=4.0",
    "faker>=30.0",
    "pytest>=8.0",
    "pytest-django>=4.8",
    "ruff>=0.15.12",
]





[tool.uv]
package = false
default-groups = ["dev"]
# No cache-dir: a CWD-relative cache mints strays wherever uv runs; the
# default per-user cache is shared and correct.

