[project]
name = "angee-messaging-bridges"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = ["django-angee[postgres]"]

[dependency-groups]
dev = [
  "daphne>=4.0",
  "faker>=30.0",
  "pytest>=8.0",
  "pytest-django>=4.8",
  "ruff>=0.15.12",
]

# Compiled from addons/ and ../angee/addons because the bridge test environment composes both roots.



# GENERATED by angee build from the enabled addons' manifests — do not edit
addons = [
    "aiosqlite>=0.21",
    "anthropic>=0.109.2",
    "asyncpg>=0.30",
    "authlib>=1.7.2",
    "channels-redis>=4.2",
    "channels>=4.0",
    "croniter>=6.0",
    "cryptg>=0.6.0",
    "discord-py>=2.7",
    "django-anymail>=15.1",
    "django-axes>=8.0",
    "django-import-export>=4.3",
    "django-zed-rebac[strawberry-django]>=0.15.2",
    "fastmcp>=3.4.2,<4",
    "httpcore>=1.0,<2",
    "httpx>=0.28.1,<0.29",
    "imapclient>=3.1.0",
    "mail-parser-reply>=1.36",
    "markdown-it-py>=4.2",
    "mautrix[encryption]",
    "mcp>=1.2",
    "neonize>=0.4.3.post0",
    "openai>=2.43.0",
    "phonenumbers>=9.0",
    "pydantic-ai-slim>=2.13",
    "pydantic-ai-slim[anthropic]>=2.13",
    "pydantic-ai-slim[mcp]>=2.13",
    "pydantic-ai-slim[openai]>=2.13",
    "pydantic>=2.13",
    "pyjwt[crypto]>=2.12",
    "python-dateutil>=2.9",
    "python-magic>=0.4.27",
    "pyyaml>=6",
    "qrcode[pil]>=8.2",
    "ruamel.yaml>=0.18",
    "slack-sdk>=3.43.0",
    "strawberry-django-aggregates>=0.11.0",
    "strawberry-django-hasura>=0.8.1",
    "strawberry-graphql @ git+https://github.com/ang-ee/strawberry.git@e4fa3198f704d81b3ca96b6dcac75420c5fee516",
    "strawberry-graphql-django>=0.86.7",
    "tablib>=3",
    "telethon>=1.44",
    "vobject>=0.9.9",
]

[tool.uv]
package = false
default-groups = ["dev", "addons"]
# No cache-dir: a CWD-relative cache mints strays wherever uv runs; the
# default per-user cache is shared and correct.

[tool.uv.extra-build-variables]
python-olm = { CXXFLAGS = "-fdelayed-template-parsing" }

[tool.uv.sources]
django-angee = { path = "../angee", editable = true }

[tool.pytest.ini_options]
cache_dir = ".pytest_cache"
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
pythonpath = [".", "addons", "../angee/addons"]
addopts = "-ra --strict-markers --import-mode=importlib"

[tool.ruff]
line-length = 120
target-version = "py314"
cache-dir = ".ruff_cache"
src = [".", "addons", "../angee/addons"]
exclude = [
  ".angee",
  ".git",
  ".mypy_cache",
  ".reference",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
  "node_modules",
  "**/runtime",
  # Digest-pinned after materialization (see angee/compose/migrations.py);
  # mechanical reformatting breaks composed hosts.
  "**/runtime_migrations",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
