build-system = { requires = ["hatch-angee>=1.1,<2"], build-backend = "hatch_angee" }

[project]
name = "angee-messaging-integrate-signal"
version = "1.0.0"
description = "Signal sync — pairs signal-cli as a linked device and pulls chats into messaging"
keywords = ["signal", "chat", "sync"]
dependencies = ["angee-messaging>=3,<4", "angee-integrate>=3,<4", "angee-parties>=3,<4", "angee-web>=3,<4"]

[project.entry-points]
"angee.addons" = {"angee.messaging_integrate_signal" = "angee.messaging_integrate_signal"}

[tool.angee]

[[tool.angee.resources.master]]
path = "master/010_integrate.vendor.yaml"
adopt = "slug"

[tool.angee.platform]
category = "Integration"
