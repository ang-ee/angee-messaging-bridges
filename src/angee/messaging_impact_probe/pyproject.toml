build-system = { requires = ["hatch-angee>=1.1,<2"], build-backend = "hatch_angee" }

[project]
name = "angee-messaging-impact-probe"
version = "1.0.0"
description = "Messaging Impact Probe: messagingimpactprobe records owned by their creator."
keywords = ["messaging_impact_probe"]
dependencies = [
  "angee-base>=3,<4",
  "angee-iam>=3,<4",
  "angee-graphql>=3,<4",
  "angee-resources>=3,<4",

  "angee-web>=3,<4",

]
dynamic = ["entry-points"]

[tool.angee.resources]
demo = [
  { path = "demo/010_messaging_impact_probe.messagingimpactprobe.yaml", depends_on = "iam:demo/010_iam.user.yaml" },
]
