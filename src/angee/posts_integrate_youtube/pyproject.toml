build-system = { requires = ["hatch-angee>=1.1,<2"], build-backend = "hatch_angee" }

[project]
name = "angee-posts-integrate-youtube"
version = "1.0.0"
description = "Connect a YouTube channel, poll its comments, and publish public replies"
keywords = ["youtube", "feeds", "comments"]
dependencies = ["angee-posts>=3,<4", "angee-integrate>=3,<4", "angee-parties>=3,<4", "django-compose>=0.1.0.dev1,<0.2"]
dynamic = ["entry-points"]

[tool.angee]

[[tool.angee.resources.install]]
path = "install/010_integrate.oauthclient.yaml"
adopt = ["slug", "environment"]

[tool.angee.platform]
category = "Integration"
